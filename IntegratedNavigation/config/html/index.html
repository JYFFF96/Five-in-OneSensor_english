<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="keywords" content="Baidu Maps,Baidu MapsAPI，Baidu Maps Customization Tool，Baidu Maps WYSIWYG Tool" />
    <meta name="description" content="Baidu MapsAPICustom Map，Create a Baidu map through visual editing" />
    <title>Baidu MapsAPICustom Map</title>
    <!--引用百度地图API-->
    <script type="text/javascript" src="./qwebchannel.js"></script>
    <script type="text/javascript" src="http://api.map.baidu.com/api?v=2.0&ak=yGPTk9YZJ6aI67JaRkTQzWH1qopdnZTZ"></script>
    <script type="text/javascript" src="https://api.map.baidu.com/library/DrawingManager/1.4/src/DrawingManager_min.js"></script>
    <link rel="stylesheet" href="https://api.map.baidu.com/library/DrawingManager/1.4/src/DrawingManager_min.css" />
  </head>

  <body>
    <!--百度地图容器-->
	<!--p id="message">等待 C++ 发送消息...</p-->
    <div style="width: 98vw; height: 95vh; border: #ccc solid 1px; font-size: 12px" id="map"></div>

    <script type="text/javascript">
      //创建和初始化地图函数：
	  

      function initMap() {
        createMap(); //创建地图
        setMapEvent(); //设置地图事件
        addMapControl(); //向地图添加控件
        addMapOverlay(); //向地图添加覆盖物
      }
      function createMap() {
        map = new BMap.Map('map');
        map.centerAndZoom(new BMap.Point(116.403874, 39.914889), 12);
      }
      function setMapEvent() {
        map.enableScrollWheelZoom();
        map.enableKeyboard();
        map.enableDragging();
        map.enableDoubleClickZoom();
      }
      function addClickHandler(target, window) {
        target.addEventListener('click', function () {
          target.openInfoWindow(window);
        });
      }
      function addMapOverlay() {}
      //向地图添加控件
      function addMapControl() {
        var scaleControl = new BMap.ScaleControl({ anchor: BMAP_ANCHOR_BOTTOM_LEFT });
        scaleControl.setUnit(BMAP_UNIT_IMPERIAL);
        map.addControl(scaleControl);
        var navControl = new BMap.NavigationControl({ anchor: BMAP_ANCHOR_TOP_LEFT, type: 0 });
        map.addControl(navControl);
        var overviewControl = new BMap.OverviewMapControl({ anchor: BMAP_ANCHOR_BOTTOM_RIGHT, isOpen: true });
        map.addControl(overviewControl);
        var myDrawingManagerObject = new BMapLib.DrawingManager(map, {
          isOpen: false,
          drawingType: BMAP_DRAWING_MARKER,
          enableDrawingTool: true,
          enableCalculate: false,
          drawingToolOptions: {
            anchor: BMAP_ANCHOR_TOP_RIGHT,
            offset: new BMap.Size(5, 5),
            drawingTypes: [BMAP_DRAWING_MARKER, BMAP_DRAWING_CIRCLE, BMAP_DRAWING_POLYLINE, BMAP_DRAWING_POLYGON, BMAP_DRAWING_RECTANGLE]
          },
          polylineOptions: {
            strokeColor: '#333'
          }
        });
        myDrawingManagerObject.addEventListener('polylinecomplete', function (e, overlay) {
          if (lastOverlay) {
			console.error("lastOverlay is not empty");
			map.removeOverlay(lastOverlay);
		  }
		  console.error("lastOverlay is empty");
          lastOverlay = overlay;
          var points = e.getPath(); // 获取所有点的坐标
          var coordinates = points.map(function (point) {
            return { lng: point.lng, lat: point.lat };
          });
          // 将坐标传递给QT
          if (bridge) { // 确保 bridge 已经初始化
                bridge.receiveMessage(JSON.stringify(points));
            } else {
                console.error("Qt WebChannel bridge is not initialized");
            }
        });
      }
	  function updateMarker(lng, lat) {
        var newPoint = new BMap.Point(lng, lat);

        if (!currentMarker) {
            // 第一次创建点
            currentMarker = new BMap.Marker(newPoint);
            map.addOverlay(currentMarker);
        } else {
            // 更新点的位置
            currentMarker.setPosition(newPoint);
        }

        // 让地图跟随最新点移动
       // map.panTo(newPoint);
    }
	function parseMessage(message) {
        try {
            let data = JSON.parse(message); // 直接解析标准 JSON
            return { lng: parseFloat(data.lng), lat: parseFloat(data.lat) };
        } catch (error) {
            console.error("Unable to parse coordinates:", message, error);
            return null;
        }
    }
      var map;
      initMap();
	  var bridge = null;
	  var lastOverlay = null;
	  var currentMarker = null; // 存储当前点
	  window.onload = function () {
            if (window.qt && qt.webChannelTransport) {
                new QWebChannel(qt.webChannelTransport, function (channel) {
                    bridge = channel.objects.bridge;
					bridge.messageFromCpp.connect(function (message) {
                      var data = parseMessage(message);
                    if (data) {
                        updateMarker(data.lng, data.lat);
                    }
						<!--document.getElementById("message").innerText = "来自 C++：" + message;-->
					});
                });
            }
        };
    </script>
  </body>
</html>
