<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qt WebChannel Interaction</title>
    <script type="text/javascript" src="./qwebchannel.js"></script>
</head>
<body>
<div style="width: 98vw; height: 95vh; border: #ccc solid 1px; font-size: 12px" id="map"></div>
    <h1>Qt WebChannel Interaction Example</h1>
    <button onclick="sendMessageToQt()">Send Message to Qt</button>

    <script>
        var bridge = null;

        // 确保 Qt WebChannel 初始化完成
        window.onload = function () {
            if (window.qt && qt.webChannelTransport) {
                new QWebChannel(qt.webChannelTransport, function (channel) {
                    bridge = channel.objects.bridge;
                });
            }
        };

        // 发送消息到 Qt
        function sendMessageToQt() {
            if (bridge) {
                bridge.receiveMessage("Hello from HTML!");
            } else {
                console.error("Qt WebChannel is not initialized");
            }
        }
		
		// 确保在DOM加载完成后执行代码
        document.addEventListener("DOMContentLoaded", function() {
            // 初始化QWebChannel
            new QWebChannel(qt.webChannelTransport, function(channel) {
                window.bridge = channel.objects.bridge;
            });

            // 接收来自C++的消息
            function receiveMessage(message) {
                document.getElementById("message").innerText = message;
				console.log("receiveMessage:" message);
            }

            // 将receiveMessage函数暴露给全局作用域
            window.receiveMessage = receiveMessage;
        });
    </script>
</body>
</html>
