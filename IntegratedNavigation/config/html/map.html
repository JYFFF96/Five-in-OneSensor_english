<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Baidu Maps Example</title>
    <script type="text/javascript" src="https://api.map.baidu.com/api?v=3.0&ak=yGPTk9YZJ6aI67JaRkTQzWH1qopdnZTZ"></script>
</head>
<body>
    <div style="width: 98vw; height: 95vh; border: #ccc solid 1px; font-size: 12px" id="map"></div>
    <script type="text/javascript">
        var map = new BMap.Map("map");
        var point = new BMap.Point(116.404, 39.915);
        map.centerAndZoom(point, 15);
        map.enableScrollWheelZoom(true);

        function sendToQt(message) {
            // 调用QT的C++方法
            window.qtObject.receiveMessage(message);
        }

        map.addEventListener("click", function(e) {
        var message = "Map clicked. Coordinates: " + e.point.lng + ", " + e.point.lat;
            sendToQt(message);
        });
    </script>
</body>
</html>
