name: Restore large libraries

on:
  push:
    branches: [main]
    paths:
      - '.codex-upload-parts/**'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original debug libraries
        shell: bash
        run: |
          cat .codex-upload-parts/mmwave/part* > mmWaveRadar/libs/debug/QXlsx.lib
          cat .codex-upload-parts/ultrasonic/part* > UltrasonicRadar/libs/debug/QXlsx.lib
          echo "1dce77d125d3ef3efced62e3c789d6a7305b28dc60392fe3f8caae7589a83d78  mmWaveRadar/libs/debug/QXlsx.lib" | sha256sum -c -
          echo "51ea8bca171b53201dbefeced709b8013e6c39616741bb927a790cf5f201a77d  UltrasonicRadar/libs/debug/QXlsx.lib" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f mmWaveRadar/libs/debug/QXlsx.lib UltrasonicRadar/libs/debug/QXlsx.lib
          git commit -m "Restore complete original debug libraries"
          git push
